<body>

    <!-- Full-Width Header -->
    <header class="top-nav">
        <div class="logo">
            <span class="logo-mark"></span>
            <span class="logo-title">TharunSpeed</span>
        </div>
        <div class="connection-pill" id="headerConnectionPill">
            <span id="badgeIcon">⚡</span>
            <span id="badgeText">Detecting connection...</span>
        </div>
    </header>

    <!-- Full-Screen Main Content -->
    <main class="full-main">
        
        <!-- Live Connection Status Pills -->
        <div class="connection-tags">
            <div class="pill">
                <span class="pill-label">Connection:</span>
                <strong id="connectionTypeVal">Detecting...</strong>
            </div>
            <div class="pill">
                <span class="pill-label">Network:</span>
                <strong id="networkCarrierVal">Detecting...</strong>
            </div>
        </div>

        <!-- Giant Full-Screen Hero Speed Display -->
        <section class="hero-speed">
            <div class="speed-value-row">
                <span class="speed-number" id="heroSpeed">0.0</span>
                <span class="speed-unit">Mbps</span>
            </div>
            <div class="speed-status" id="stageLabel">Your Internet Speed</div>
            <button class="primary-btn" id="startBtn">Start Speed Test</button>
        </section>

        <!-- Full-Width Metrics Strip -->
        <section class="metrics-strip">
            <div class="metric-item">
                <span class="m-label">Download</span>
                <div class="m-val"><strong id="downloadValue">--</strong> <span class="m-unit">Mbps</span></div>
            </div>
            <div class="metric-divider"></div>
            <div class="metric-item">
                <span class="m-label">Upload</span>
                <div class="m-val"><strong id="uploadValue">--</strong> <span class="m-unit">Mbps</span></div>
            </div>
            <div class="metric-divider"></div>
            <div class="metric-item">
                <span class="m-label">Latency (Ping)</span>
                <div class="m-val"><strong id="pingValue">--</strong> <span class="m-unit">ms</span></div>
            </div>
            <div class="metric-divider"></div>
            <div class="metric-item">
                <span class="m-label">Jitter</span>
                <div class="m-val"><strong id="jitterValue">--</strong> <span class="m-unit">ms</span></div>
            </div>
        </section>

    </main>

    <!-- Full-Width Footer with Developer Link -->
    <footer class="bottom-footer">
        <span>TharunSpeed &copy; 2026 &bull; Developed by <a href="https://tharunkumark4743.netlify.app/" target="_blank" rel="noopener noreferrer" style="color: inherit; font-weight: 600; text-decoration: underline;">Tharunkumar K</a></span> &bull;
        <span id="gatewayInfo">Gateway: Detecting...</span>
    </footer>

    <script src="speed-engine.js"></script>
    <script src="app.js"></script>
</body>
